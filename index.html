<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="影视微信">
<meta name="theme-color" content="#ededed">
<link rel="manifest" href="manifest.webmanifest">
<title>神秘人</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#ededed;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}
.app{width:100%;height:100%;display:flex;flex-direction:column;background:#ededed}
.nav{height:52px;min-height:52px;background:#ededed;border-bottom:1px solid #d6d6d6;display:flex;align-items:center;position:relative}
.back{font-size:31px;line-height:1;padding:0 14px;border:0;background:none;color:#111}
.title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;white-space:nowrap}
.more{margin-left:auto;border:0;background:none;font-size:23px;padding:0 15px;letter-spacing:2px}
.messages{flex:1;overflow-y:auto;padding:12px 12px 15px;-webkit-overflow-scrolling:touch}
.time{text-align:center;color:#999;font-size:11px;margin:5px 0 12px}
.row{display:flex;gap:9px;margin:11px 0;align-items:flex-start}
.row.me{justify-content:flex-end}
.avatar{width:42px;height:42px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:600}
.them .avatar{background:#718397}
.me .avatar{background:#75c74f}
.bubble{max-width:75%;padding:9px 12px;border-radius:4px;font-size:16px;line-height:1.48;word-break:break-word;box-shadow:0 0 0 1px rgba(0,0,0,.025)}
.them .bubble{background:#fff}
.me .bubble{background:#95ec69}
.composer{min-height:62px;background:#f7f7f7;border-top:1px solid #d0d0d0;display:flex;align-items:center;gap:7px;padding:8px 9px max(8px,env(safe-area-inset-bottom))}
.icon{width:35px;height:40px;border:0;background:none;font-size:27px;color:#333;padding:0}
.input{flex:1;min-width:0;height:40px;border:1px solid #c9c9c9;border-radius:5px;background:#fff;padding:0 10px;font-size:16px;outline:none;-webkit-appearance:none}
.send{height:38px;padding:0 13px;border:0;border-radius:5px;background:#07c160;color:#fff;font-size:14px}
.send:active{opacity:.7}
@media (min-width:600px){
body{display:flex;justify-content:center;align-items:center;padding:0;background:#111}
.app{width:430px;height:min(100vh,860px);box-shadow:0 12px 50px rgba(0,0,0,.35);border-radius:20px;overflow:hidden}
}
</style>
</head>
<body>
<div class="app">
<div class="nav"><button class="back" type="button" aria-label="返回">‹</button><div class="title">神秘人</div><button class="more" type="button">•••</button></div>
<main class="messages" id="messages">
<div class="time">昨天 21:43</div>
<div class="row them"><div class="avatar">神</div><div class="bubble">你还在公司吗？</div></div>
<div class="row me"><div class="bubble">还在。</div><div class="avatar">我</div></div>
<div class="row them"><div class="avatar">神</div><div class="bubble">那个人找过你了。</div></div>
<div class="row them"><div class="avatar">神</div><div class="bubble">现在离开公司，别走正门。</div></div>
</main>
<form class="composer" id="form">
<button class="icon" type="button">＋</button>
<input id="input" class="input" autocomplete="off" placeholder="输入消息……">
<button class="send" type="submit">发送</button>
</form>
</div>
<script>
const messages=document.getElementById('messages'),input=document.getElementById('input'),form=document.getElementById('form');
function addMessage(text){
const row=document.createElement('div');row.className='row me';
row.innerHTML='<div class="bubble"></div><div class="avatar">我</div>';
row.querySelector('.bubble').textContent=text;
messages.appendChild(row);messages.scrollTop=messages.scrollHeight;
}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;addMessage(text);input.value='';input.focus()});
messages.scrollTop=messages.scrollHeight;
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
